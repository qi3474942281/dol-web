name: Build and verify mobile resource delivery
on:
  push:
    branches: ['fix/mobile-assets', 'fix/wardrobe-capacity', 'fix/request-pacing', 'fix/mobile-performance', 'fix/mobile-clothing-composition', 'fix/sync-clothing-compat', 'feat/freeze-time']
    paths-ignore: ['mobile/**', 'mobile.html', 'index.html', 'play.html', 'launch.html', 'start.html']
  workflow_dispatch:
concurrency:
  group: dol-mobile-assets
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node tools/verify_http_queue.cjs
      - run: python tools/build_mobile.py
      - id: commit
        name: Commit generated mobile resources
        env:
          MOBILE_FEATURE_BRANCH: ${{ github.ref_name }}
        run: |
          git add mobile.html mobile index.html play.html launch.html start.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Generate chunked mobile game and lazy BESC UCB art' > /tmp/mobile-commit.log
            tail -n 1 /tmp/mobile-commit.log
            git push origin "HEAD:$MOBILE_FEATURE_BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  browser:
    needs: build
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: node tools/serve_startup.mjs > /tmp/dol-mobile-server.log 2>&1 &
      - run: node tools/verify_mobile.mjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-verification-${{ matrix.browser }}
          path: verification/
