name: Build and verify Chinese upgrade
on:
  push:
    branches: ['fix/offline-bundle']
    paths-ignore: ['game.html', 'legacy.html', 'mods/**', 'modList.json', 'legacy-modList.json', 'upstream-release.json', 'dol-*.zip']
  workflow_dispatch:
concurrency:
  group: dol-offline-bundle
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download, verify, and assemble official release
        run: python tools/upgrade_dol.py
      - name: Save reproducible release files
        run: |
          git add dol-*.zip game.html legacy.html mods modList.json legacy-modList.json upstream-release.json LICENSE CREDITS.md UPSTREAM-README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Embed verified Chinese translation and images in an offline game bundle'
            git push origin HEAD:fix/offline-bundle
          fi
  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offline-bundle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps webkit
        if: matrix.browser == 'webkit'
      - name: Start local server
        run: |
          python -m http.server 8765 > /tmp/dol-server.log 2>&1 &
          echo $! > /tmp/dol-server.pid
      - name: Verify old-save migration and new Chinese release
        run: node tools/verify_upgrade.mjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.browser }}
          path: verification/
