name: Validate and publish mobile v9 offline ZIP
on:
  push:
    branches: ['release/offline-v9']
permissions:
  contents: read
concurrency:
  group: offline-v9-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and check the offline archive
        run: |
          mkdir -p release-offline /tmp/dol-offline
          python3 tools/build_offline_v9.py . release-offline/DoL-0.5.12.13-BESC-UCB-Offline-v9.zip
          cd release-offline
          python3 ../tools/verify_offline_v9.py ..
          python3 -m zipfile -e DoL-0.5.12.13-BESC-UCB-Offline-v9.zip /tmp/dol-offline
          sha256sum DoL-0.5.12.13-BESC-UCB-Offline-v9.zip > SHA256SUMS.txt
      - run: npm install --no-save playwright@1.56.1
      - name: Test WebKit startup without internet access
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/dol-offline &
          node tools/verify_offline_browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: offline-v9-verified
          path: release-offline/
          compression-level: 0
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offline-v9-verified
      - name: Publish direct download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c SHA256SUMS.txt
          gh release create dol-web-offline-v9 DoL-0.5.12.13-BESC-UCB-Offline-v9.zip SHA256SUMS.txt --target 13d8ab1d17137314e896f1412676b112025f6945 --title 'DoL 0.5.12.13 BESC/UCB 离线修复版 v9' --notes '包含 v9 服装与人物身形匹配、立绘加载和城镇底图修复。iPhone 解压后使用 TinyServer 打开「开始游戏.html」。' --latest=false
