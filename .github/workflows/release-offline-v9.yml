name: Inspect clothing coverage report
on:
  push:
    branches: ['release/offline-clothing-audit']
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh release download dol-web-offline-clothing-audit --pattern clothing-audit.json
          cat clothing-audit.json